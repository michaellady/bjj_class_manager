<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJJ Class Attendance</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BJJ Class Attendance System</h1>
        <p>This is a simple test page for the BJJ Class Attendance system.</p>
        
        <h2>Upload a Class Photo</h2>
        <form id="uploadForm">
            <div>
                <label for="imageUrl">Instagram URL:</label>
                <input type="text" id="imageUrl" name="imageUrl" 
                       placeholder="https://www.instagram.com/p/XXXXX/" style="width: 400px;">
            </div>
            <div style="margin-top: 10px;">
                <label for="classDate">Class Date:</label>
                <input type="date" id="classDate" name="classDate">
            </div>
            <div style="margin-top: 10px;">
                <button type="submit">Upload</button>
            </div>
        </form>
        
        <div id="status" style="margin-top: 20px;"></div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const imageUrl = document.getElementById('imageUrl').value;
            const classDate = document.getElementById('classDate').value;
            
            if (!imageUrl) {
                alert('Please enter an Instagram URL');
                return;
            }
            
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = 'Uploading...';
            
            const formData = new FormData();
            formData.append('image_url', imageUrl);
            formData.append('date', classDate || new Date().toISOString());
            
            fetch('/api/images/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    statusDiv.innerHTML = `Upload successful! Image ID: ${data.image_id}`;
                } else {
                    statusDiv.innerHTML = `Error: ${data.error || 'Unknown error'}`;
                }
            })
            .catch(error => {
                statusDiv.innerHTML = `Error: ${error.message}`;
            });
        });
    </script>
</body>
</html>
