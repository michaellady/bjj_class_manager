name: BJJ Class Pictures CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest-16-cores
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo apt-get clean
        df -h
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 ffmpeg libgl1-mesa-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gdown tensorboard
        # Install packages in smaller batches to avoid disk space issues
        grep -v "torch\|torchvision\|ultralytics\|opencv" requirements.txt > requirements_small.txt || true
        pip install --no-cache-dir -r requirements_small.txt
        pip install --no-cache-dir torch torchvision opencv-python-headless
        pip install --no-cache-dir ultralytics
    
    - name: Initialize database
      run: |
        python -c "from src.database_setup import initialize_database; initialize_database()"
    
    - name: Start Flask app in background
      env:
        PYTHONPATH: ${{ github.workspace }}
        FLASK_APP: src.app
      run: |
        nohup python -m flask run --host=0.0.0.0 --port=5001 > flask.log 2>&1 &
        echo "Waiting for Flask app to start..."
        sleep 10
        curl -s http://localhost:5001/ || echo "Flask app may not be ready yet, but continuing..."
        cat flask.log
    
    - name: Run tests
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m unittest discover -s src -p "test_*.py"
    
    - name: Optimize Docker builds
      run: |
        # Create optimized Dockerfile.ci for CI builds
        cat > Dockerfile.ci << EOL
        FROM python:3.13-slim
        
        WORKDIR /app
        
        # Install system dependencies
        RUN apt-get update && apt-get install -y \\
            libsqlite3-dev \\
            curl \\
            libgl1 \\
            libglib2.0-0 \\
            libsm6 \\
            libxext6 \\
            libxrender1 \\
            ffmpeg \\
            && rm -rf /var/lib/apt/lists/*
        
        # Copy requirements first to leverage Docker cache
        COPY requirements.txt .
        
        # Install dependencies in stages to reduce layer size
        RUN pip install --no-cache-dir gdown tensorboard && \\
            pip install --no-cache-dir torch torchvision opencv-python-headless && \\
            pip install --no-cache-dir -r requirements.txt && \\
            pip cache purge
        
        # Copy application code
        COPY . .
        
        # Create necessary directories
        RUN mkdir -p pictures/incoming \\
            data/face_crops \\
            data/representative_features \\
            data/representative_persons
        
        # Create startup script
        RUN echo '#!/bin/bash\\npython -c "from src.database_setup import initialize_database; initialize_database()"\\npython -m flask run --host=0.0.0.0 --port=5001' > /app/start.sh && chmod +x /app/start.sh
        
        ENV PYTHONPATH=/app
        EXPOSE 5001
        CMD ["/app/start.sh"]
        EOL
        
        # Create optimized Dockerfile.test.ci for CI test builds
        cat > Dockerfile.test.ci << EOL
        FROM python:3.13-slim
        
        WORKDIR /app
        
        # Install system dependencies
        RUN apt-get update && apt-get install -y \\
            libsqlite3-dev \\
            libgl1 \\
            libglib2.0-0 \\
            libsm6 \\
            libxext6 \\
            libxrender1 \\
            ffmpeg \\
            && rm -rf /var/lib/apt/lists/*
        
        # Copy requirements first to leverage Docker cache
        COPY requirements.txt .
        
        # Install dependencies in stages to reduce layer size
        RUN pip install --no-cache-dir gdown tensorboard && \\
            pip install --no-cache-dir torch torchvision opencv-python-headless && \\
            pip install --no-cache-dir -r requirements.txt && \\
            pip cache purge
        
        # Copy application code
        COPY . .
        
        # Create necessary directories
        RUN mkdir -p pictures/incoming \\
            data/face_crops \\
            data/representative_features \\
            data/representative_persons
        
        # Set environment variable for test database
        ENV DB_NAME=test_bjj_attendance.db
        ENV PYTHONPATH=/app
        
        # Initialize the test database
        RUN python init_test_db.py
        
        # Command to run tests
        CMD ["python", "-m", "unittest", "discover", "-s", "src", "-p", "test_*.py"]
        EOL
    
    - name: Build Docker images
      run: |
        docker build -t class-pictures-app:${{ github.sha }} -f Dockerfile.ci .
        docker build -t class-pictures-test:${{ github.sha }} -f Dockerfile.test.ci .
    
    - name: Save Docker images as artifacts
      run: |
        mkdir -p docker-images
        docker save class-pictures-app:${{ github.sha }} | gzip > docker-images/class-pictures-app.tar.gz
        docker save class-pictures-test:${{ github.sha }} | gzip > docker-images/class-pictures-test.tar.gz
    
    - name: Upload Docker images as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: docker-images
        path: docker-images/
        retention-days: 7
    
    - name: Create application package
      run: |
        mkdir -p dist
        # Exclude unnecessary files and directories
        tar --exclude="venv" --exclude=".git" --exclude="data/face_crops" \
            --exclude="data/representative_features" --exclude="data/representative_persons" \
            --exclude="pictures/incoming" --exclude="debug_output" --exclude="debug_output_reid" \
            --exclude="test_data" --exclude="test_pictures" --exclude="test_output" \
            --exclude="docker-images" --exclude="dist" \
            -czf dist/class-pictures-app.tar.gz .
    
    - name: Upload application package
      uses: actions/upload-artifact@v4
      with:
        name: application-package
        path: dist/class-pictures-app.tar.gz
        retention-days: 7

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
    - name: Download application package
      uses: actions/download-artifact@v4
      with:
        name: application-package
        path: dist
    
    - name: Download Docker images
      uses: actions/download-artifact@v4
      with:
        name: docker-images
        path: docker-images
    
    - name: Set up Docker images
      run: |
        docker load < docker-images/class-pictures-app.tar.gz
        docker load < docker-images/class-pictures-test.tar.gz
    
    - name: Tag Docker images for deployment
      run: |
        docker tag class-pictures-app:${{ github.sha }} class-pictures-app:latest
        docker tag class-pictures-test:${{ github.sha }} class-pictures-test:latest
    
    # The following steps would be added for actual deployment
    # - name: Deploy to production server
    #   run: |
    #     # Add deployment steps here, such as:
    #     # - SSH into production server
    #     # - Transfer application package
    #     # - Extract and restart services
    #     echo "Deployment would happen here"
    
    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/class-pictures-app.tar.gz
          docker-images/class-pictures-app.tar.gz
          docker-images/class-pictures-test.tar.gz 