name: BJJ Class Pictures CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo apt-get clean
        df -h
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 ffmpeg libgl1-mesa-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gdown tensorboard
        pip install torch torchvision
        pip install torchreid
        pip install -r requirements.txt
    
    - name: Initialize database
      run: |
        python -c "from src.database_setup import initialize_database; initialize_database()"
    
    - name: Start Flask app in background with detailed logging
      env:
        PYTHONPATH: ${{ github.workspace }}
        FLASK_APP: src.app
        FLASK_DEBUG: 1
      run: |
        # Redirect both stdout and stderr to log file for better debugging
        python -m flask run --host=0.0.0.0 --port=5001 > flask.log 2>&1 &
        # Save the PID so we can check on it later
        echo $! > flask.pid
        echo "Flask app started with PID $(cat flask.pid)"
        # Give it a moment to start
        sleep 10
        # Check if process is still running
        if ps -p $(cat flask.pid) > /dev/null; then
          echo "Flask process is running"
        else
          echo "Flask process died. Here's the log:"
          cat flask.log
          exit 1
        fi
        # Try to connect to make sure it's responding
        curl -v http://localhost:5001/health || echo "Flask app may not be ready yet, but process is running"
        # Show the last 50 lines of logs
        echo "Last 50 lines of Flask logs:"
        tail -n 50 flask.log
    
    - name: Wait for Flask app to be fully ready
      run: |
        # Try for up to 30 seconds
        for i in {1..30}; do
          if curl -s http://localhost:5001/health > /dev/null; then
            echo "Flask app is ready!"
            break
          fi
          echo "Waiting for Flask app to be ready (attempt $i/30)..."
          sleep 1
          # Check if process is still alive
          if ! ps -p $(cat flask.pid) > /dev/null; then
            echo "Flask process died during wait. Here's the log:"
            cat flask.log
            exit 1
          fi
        done
        # Final check
        if ! curl -s http://localhost:5001/health > /dev/null; then
          echo "Flask app failed to start properly after 30 attempts. Here's the log:"
          cat flask.log
          exit 1
        fi
    
    - name: Run tests
      env:
        PYTHONPATH: ${{ github.workspace }}
        BASE_URL: http://localhost:5001
      run: |
        python -m unittest discover -s src -p "test_*.py"
    
    - name: Build Docker images
      run: |
        docker build -t class-pictures-app:${{ github.sha }} .
        docker build -t class-pictures-test:${{ github.sha }} -f Dockerfile.test .
    
    - name: Save Docker images as artifacts
      run: |
        mkdir -p docker-images
        docker save class-pictures-app:${{ github.sha }} | gzip > docker-images/class-pictures-app.tar.gz
        docker save class-pictures-test:${{ github.sha }} | gzip > docker-images/class-pictures-test.tar.gz
    
    - name: Upload Docker images as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: docker-images
        path: docker-images/
        retention-days: 7
    
    - name: Create application package
      run: |
        mkdir -p dist
        # Exclude unnecessary files and directories
        tar --exclude="venv" --exclude=".git" --exclude="data/face_crops" \
            --exclude="data/representative_features" --exclude="data/representative_persons" \
            --exclude="pictures/incoming" --exclude="debug_output" --exclude="debug_output_reid" \
            --exclude="test_data" --exclude="test_pictures" --exclude="test_output" \
            --exclude="docker-images" --exclude="dist" \
            -czf dist/class-pictures-app.tar.gz .
    
    - name: Upload application package
      uses: actions/upload-artifact@v4
      with:
        name: application-package
        path: dist/class-pictures-app.tar.gz
        retention-days: 7

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
    - name: Download application package
      uses: actions/download-artifact@v4
      with:
        name: application-package
        path: dist
    
    - name: Download Docker images
      uses: actions/download-artifact@v4
      with:
        name: docker-images
        path: docker-images
    
    - name: Set up Docker images
      run: |
        docker load < docker-images/class-pictures-app.tar.gz
        docker load < docker-images/class-pictures-test.tar.gz
    
    - name: Tag Docker images for deployment
      run: |
        docker tag class-pictures-app:${{ github.sha }} class-pictures-app:latest
        docker tag class-pictures-test:${{ github.sha }} class-pictures-test:latest
    
    # The following steps would be added for actual deployment
    # - name: Deploy to production server
    #   run: |
    #     # Add deployment steps here, such as:
    #     # - SSH into production server
    #     # - Transfer application package
    #     # - Extract and restart services
    #     echo "Deployment would happen here"
    
    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/class-pictures-app.tar.gz
          docker-images/class-pictures-app.tar.gz
          docker-images/class-pictures-test.tar.gz 